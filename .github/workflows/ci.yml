name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Prepare the CLI contract-test binary
        shell: bash
        run: |
          set -euo pipefail
          asset=agent-jsonl-compact-x86_64-unknown-linux-musl
          archive="$RUNNER_TEMP/$asset.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/yuki-inaho/agent-jsonl-compact/releases/download/v0.5.1/$asset.tar.gz" \
            --output "$archive"
          echo "769460cc12ebabae2d2e7d43bd7992ab41e9c12dd12778145825c91ecf462c69  $archive" | sha256sum --check
          binary="$RUNNER_TEMP/agent-jsonl-compact"
          tar -xOzf "$archive" "$asset/agent-jsonl-compact" > "$binary"
          chmod 755 "$binary"
          "$binary" version --output json
          echo "AGENT_JSONL_COMPACT=$binary" >> "$GITHUB_ENV"
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests -q
